<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Effect Agent 用到了哪些能力（33 个项目，可多选）">
  <style>
    .title { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
