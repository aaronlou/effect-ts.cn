  <text x="198" y="244" text-anchor="end" class="label">schema</text><rect x="210" y="230" width="336" height="20" rx="3" class="bar" /><text x="554" y="245" class="value">26</text>
  <text x="198" y="278" text-anchor="end" class="label">resource</text><rect x="210" y="264" width="336" height="20" rx="3" class="bar" /><text x="554" y="279" class="value">26</text>
