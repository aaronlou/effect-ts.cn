    .label { font: 13px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .value { font: 600 13px ui-monospace, monospace; fill: currentColor; }
    .note { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #71717a; }
    .bar { fill: #6e56cf; }
  </style>
  <text x="16" y="26" class="title">Effect Agent 用到了哪些能力（33 个项目，可多选）</text>
  <text x="16" y="44" class="subtitle">最常用的不是 @effect/ai —— 而是运行时能力</text>
  <text x="198" y="74" text-anchor="end" class="label">gen</text><rect x="210" y="60" width="414" height="20" rx="3" class="bar" /><text x="632" y="75" class="value">32</text>
