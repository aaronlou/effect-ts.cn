<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" width="720" height="242" role="img" aria-label="Effect 使用深度（TypeScript Agent 内）">
  <style>
    .title { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .subtitle { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #71717a; }
    .label { font: 13px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .value { font: 600 13px ui-monospace, monospace; fill: currentColor; }
    .note { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #71717a; }
    .bar { fill: #6e56cf; }
  </style>
  <text x="16" y="26" class="title">Effect 使用深度（TypeScript Agent 内）</text>
  <text x="16" y="44" class="subtitle">L2+ 才算「真正在用」；L4 = Effect 是 Agent Runtime 的地基</text>
  <text x="198" y="74" text-anchor="end" class="label">L0</text><rect x="210" y="60" width="414" height="20" rx="3" class="bar" /><text x="632" y="75" class="value">816 <tspan class="note">不用</tspan></text>
  <text x="198" y="108" text-anchor="end" class="label">L1</text><rect x="210" y="94" width="4" height="20" rx="3" class="bar" /><text x="222" y="109" class="value">7 <tspan class="note">边角路径</tspan></text>
  <text x="198" y="142" text-anchor="end" class="label">L2</text><rect x="210" y="128" width="3" height="20" rx="3" class="bar" /><text x="221" y="143" class="value">6 <tspan class="note">部分业务逻辑</tspan></text>
  <text x="198" y="176" text-anchor="end" class="label">L3</text><rect x="210" y="162" width="2" height="20" rx="3" class="bar" /><text x="220" y="177" class="value">4 <tspan class="note">重要架构组成</tspan></text>
  <text x="198" y="210" text-anchor="end" class="label">L4</text><rect x="210" y="196" width="12" height="20" rx="3" class="bar" /><text x="230" y="211" class="value">23 <tspan class="note">Runtime 地基</tspan></text>
</svg>
