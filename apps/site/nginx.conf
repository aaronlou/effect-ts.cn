# 站点容器的 Nginx 配置：托管 Astro 静态产物 + 反向代理 /api 到 api 服务。
# 关键点：
#   - Astro 产出的是「目录 + index.html」与若干静态端点（/docs/x.md、/llms.txt、/cite/*.json）
#   - /api/ 转发给同 compose 网络里的 api:8787（站点前端所有 AI 面板都依赖它）
# ── 访问日志（结构化 JSON）────────────────────────────────────────────────
#
# 为什么必须自定义格式：默认 combined 格式**记不到真实访客**。
# 生产链路是 Caddy(宿主) → 127.0.0.1:18080(本容器)，nginx 看到的对端永远是 127.0.0.1，
# 于是日志里所有请求的来源都是回环地址 —— 独立访客数、地域分布全都无从谈起。
# Caddy 已经设置了 X-Real-IP（见 infra/Caddyfile.effect-ts.cn），这里把它记下来。
#
# 用 JSON 而不是拼接字符串：报表脚本可以直接解析，不用写脆弱的正则去猜字段边界。
log_format ecn_json escape=json
    '{"t":"$time_iso8601","ip":"$http_x_real_ip","m":"$request_method",'
    '"u":"$request_uri","s":$status,"b":$body_bytes_sent,"rt":$request_time,'
    '"ref":"$http_referer","ua":"$http_user_agent","host":"$host"}';

access_log /dev/stdout ecn_json;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩：文本类资源（文档站收益很大）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 静态指纹资源：一年不可变缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # AI 问答 / 报错诊断 / 语料统计：反向代理到 API 容器
    #
    # 注意这里的写法：**必须用变量 + resolver**。
    # 直接写 `proxy_pass http://api:8787;` 时，nginx 在**启动**阶段就要解析 `api` 这个主机名，
    # 解析不到就整个容器起不来 —— 于是「只部署静态站、不部署 API」或「单独跑站点镜像」
    # 都会直接崩（CI 的站点镜像冒烟就是这么挂的）。用变量后解析推迟到请求时，
    # 没有 API 时站点照常服务，只有 /api/* 返回 502。
    location /api/ {
        # Docker compose 网络的内嵌 DNS；换其他运行时请改这里
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 模型润色可能较慢（deepseek-reasoner 更慢）
        proxy_connect_timeout 5s;
    }

    # 目录式路由 + 静态端点（/docs/x.md、/llms.txt、/rss.xml、/cite/<digest>.json）
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 基础安全响应头（静态站不需要更复杂的东西）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
