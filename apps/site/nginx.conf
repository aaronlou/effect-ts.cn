# 站点容器的 Nginx 配置：托管 Astro 静态产物 + 反向代理 /api 到 api 服务。
# 关键点：
#   - Astro 产出的是「目录 + index.html」与若干静态端点（/docs/x.md、/llms.txt、/cite/*.json）
#   - /api/ 转发给同 compose 网络里的 api:8787（站点前端所有 AI 面板都依赖它）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩：文本类资源（文档站收益很大）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 静态指纹资源：一年不可变缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # AI 问答 / 报错诊断 / 语料统计：反向代理到 API 容器
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 模型润色可能较慢（deepseek-reasoner 更慢）
        proxy_connect_timeout 5s;
    }

    # 目录式路由 + 静态端点（/docs/x.md、/llms.txt、/rss.xml、/cite/<digest>.json）
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 基础安全响应头（静态站不需要更复杂的东西）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
