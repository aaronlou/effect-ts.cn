name: 站点问题
description: 报告页面渲染、链接、构建或内容错误
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: 页面 URL（或本地路径）
      placeholder: https://effect-ts.cn/docs/v4/getting-started/installation/
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际现象
      description: 截图或控制台报错更有帮助
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境（浏览器/系统；本地构建时请附命令与版本）
      placeholder: Chrome 130 / macOS 15
    validations:
      required: false
