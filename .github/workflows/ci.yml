name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不写 version：由根 package.json 的 packageManager 字段决定（写死会与它冲突，
      # 触发 "Multiple versions of pnpm specified" 而让后面所有门禁被跳过）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 内容门禁（译文 frontmatter / 路径镜像 / 术语 / 元数据残留）
        run: |
          # 注意：pnpm --filter exec 的工作目录是包目录，路径统一用绝对路径
          pnpm --filter @ecn/content exec tsx src/cli.ts check \
            --docs "$GITHUB_WORKSPACE/apps/site/src/content/docs" \
            --nav "$GITHUB_WORKSPACE/apps/site/src/data/docs-nav.json" \
            --glossary "$GITHUB_WORKSPACE/docs/glossary.json"

      - name: 提案队列门禁（Agent 起草的内容必须过与人工投稿相同的闸）
        run: |
          pnpm --filter @ecn/content exec tsx src/cli.ts proposals:check \
            --dir "$GITHUB_WORKSPACE/.proposals" \
            --docs "$GITHUB_WORKSPACE/apps/site/src/content/docs" \
            --nav "$GITHUB_WORKSPACE/apps/site/src/data/docs-nav.json" \
            --glossary "$GITHUB_WORKSPACE/docs/glossary.json"

      - name: 类型检查
        run: pnpm typecheck

      - name: 测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 语料新鲜度（内容改动后必须重新生成 corpus.json）
        run: |
          pnpm --filter @ecn/content corpus \
            --docs "$GITHUB_WORKSPACE/apps/site/src/content/docs" \
            --nav "$GITHUB_WORKSPACE/apps/site/src/data/docs-nav.json" \
            --html "$GITHUB_WORKSPACE/apps/site/dist" \
            -o /tmp/corpus.json
          node -e '
            const fs = require("node:fs");
            const committed = JSON.parse(fs.readFileSync("packages/knowledge/data/corpus.json", "utf8"));
            const fresh = JSON.parse(fs.readFileSync("/tmp/corpus.json", "utf8"));
            delete committed.generatedAt; delete fresh.generatedAt;
            if (JSON.stringify(committed) !== JSON.stringify(fresh)) {
              console.error("语料与内容不一致：请在本地运行 `pnpm build && pnpm corpus:build` 并提交 packages/knowledge/data/corpus.json");
              process.exit(1);
            }
            console.log("语料与内容一致 ✔");
          '

      - name: 引用协议门禁（引用必须可独立解引用与核验）
        run: |
          # 有了它，"引用"才不是修辞：每条引用都能解到一个带指纹与基线的静态记录
          pnpm --filter @ecn/content exec tsx src/cli.ts cite:check \
            --corpus "$GITHUB_WORKSPACE/packages/knowledge/data/corpus.json" \
            --html "$GITHUB_WORKSPACE/apps/site/dist"

      - name: 静态检索门禁（构建产物里的 /search-index.json 必须能答对金标问句）
        run: |
          # ⌘K 搜索与"无后端时的问答降级"都吃这份索引：服务端有 recall@3，产物也必须有
          # 用包内脚本（knowledge 自己声明了 tsx）：不要 `exec tsx …`，
          # 那样会依赖 PATH 上恰好有 tsx —— 本地靠别的项目碰巧能跑，CI 里直接 not found。
          pnpm --filter @ecn/knowledge check:static-search \
            --index "$GITHUB_WORKSPACE/apps/site/dist/search-index.json"

      - name: 引用锚点端到端校验（每个锚点必须能在构建产物里点到）
        run: |
          node -e '
            const fs = require("node:fs");
            const corpus = JSON.parse(fs.readFileSync("packages/knowledge/data/corpus.json", "utf8"));
            let checked = 0, missing = [];
            for (const page of corpus.pages) {
              for (const chunk of page.chunks) {
                if (chunk.anchor === undefined) continue;
                checked++;
                const html = fs.readFileSync(`apps/site/dist/docs/${page.slug}/index.html`, "utf8");
                if (!html.includes(`id="${chunk.anchor}"`)) missing.push(`${page.slug}#${chunk.anchor}`);
              }
            }
            if (missing.length > 0) {
              console.error("以下引用锚点在构建产物中不存在（引用会点空）：\n" + missing.slice(0, 10).join("\n"));
              process.exit(1);
            }
            console.log(`锚点端到端校验通过（${checked} 个）✔`);
          '

  # 代码块一致性门禁（AGENTS.md 硬约束 #2：代码块与上游**逐字节**一致）。
  # 此前这条只在 upstream-sync 里跑，而且 `set +e … exit 0` 把结果丢掉了：
  # 234 篇译文（其中 212 篇 translators 是 agent）的代码块在 PR 上没有任何机械校验。
  #
  # 基线取仓库自己声明的 `docs-nav.json.generatedFrom.head`，而不是上游 main：
  # 用 main 的话，上游一改代码块 PR 就会无辜变红 —— 那是 nightly upstream-sync
  # 该报的「落后（stale）」，不是 PR 该拦的「漂移」。
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 取上游基线（blobless + 稀疏检出，只取内容目录）
        run: |
          set -e
          SHA=$(node -e 'process.stdout.write(require("./apps/site/src/data/docs-nav.json").generatedFrom.head)')
          echo "上游基线 commit：$SHA"
          UPSTREAM="$RUNNER_TEMP/upstream"
          git init -q "$UPSTREAM"
          git -C "$UPSTREAM" remote add origin https://github.com/Effect-TS/website.git
          git -C "$UPSTREAM" sparse-checkout init --no-cone
          git -C "$UPSTREAM" sparse-checkout set apps/web/src/content/docs
          git -C "$UPSTREAM" fetch --depth 1 --filter=blob:none origin "$SHA"
          git -C "$UPSTREAM" checkout -q FETCH_HEAD

      - name: 代码块一致性（译文 vs 上游基线，逐字节）
        run: |
          pnpm --filter @ecn/content exec tsx src/cli.ts code:check \
            --upstream "$RUNNER_TEMP/upstream/apps/web/src/content/docs" \
            --docs "$GITHUB_WORKSPACE/apps/site/src/content/docs" \
            --proposals "$GITHUB_WORKSPACE/.proposals"

  # Postgres 持久化门禁：生产跑的是 Postgres 仓储，而 check 里的容器冒烟只在 InMemory 模式，
  # 在此之前 SQL / DDL / 行→聚合映射**没有任何测试碰过**。这个 job 起一个真实测试库，
  # 验证「迁移可应用且幂等」+「仓储 save/findById/findAll 往返一致」。
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: effect
          POSTGRES_PASSWORD: effect
          POSTGRES_DB: effect_ts_cn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U effect -d effect_ts_cn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Postgres 迁移 + 仓储集成测试
        env:
          # 串里必须含 "test"（测试内部有同样的护栏，防止误连开发/生产库）
          ECN_TEST_DATABASE_URL: postgresql://effect:effect@127.0.0.1:5432/effect_ts_cn_test
        run: pnpm --filter @ecn/api test

  # Docker 镜像门禁：把「未验证的参考 Dockerfile」变成「CI 里真的构建 + 起容器 + 健康检查」
  # 这也是部署的前提：镜像构建/启动一旦回归，PR 就红，不会等到上线才发现。
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 三个门禁都过了才构建/发布镜像：docker job 会把 :latest 推到 GHCR，
    # 而生产文档让服务器 `docker compose pull` 拉的就是 :latest ——
    # 没有 needs 时它与 check 并行，main 变红也照样发布。
    needs: [check, parity, postgres]
    # push 到 main 时顺带把镜像发布到 GHCR：生产服务器只 `docker compose pull`，
    # 不必在服务器上 clone 仓库（服务器到 GitHub 的 git 通道常有 HTTP/2 中断）
    # 也不必在服务器上装 Node/pnpm 跑构建。runner 本身是 amd64，天然与生产同架构。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 计算镜像仓库名（GHCR 要求全小写）
        id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR（仅 main 分支推送时）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验 compose 编排（生产编排 + Caddy 网络叠加文件）
        run: |
          set -e
          docker compose -f infra/docker-compose.prod.yml config >/dev/null
          docker network create caddy >/dev/null 2>&1 || true
          docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.caddy-network.yml config >/dev/null
          echo "compose 编排校验通过 ✔（db/api 无宿主端口；web 只绑回环）"

      # 构建用于冒烟；发布单独一步做（见下）。
      # 只构建 linux/amd64：生产是 x86_64，多架构只会让 CI 白等一倍时间。
      # 注意 push 不能用 build-push-action 的 push:true —— 它会把 tags 里的本地标签
      # `ecn-api:ci` 也当成 Docker Hub 的 library/ecn-api 一起推，直接 401。
      - name: 构建 API 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ecn-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: 发布 API 镜像到 GHCR（仅 main）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ steps.image.outputs.repo }}
        run: |
          set -e
          docker tag ecn-api:ci "$REPO/api:latest"
          docker tag ecn-api:ci "$REPO/api:${GITHUB_SHA}"
          docker push "$REPO/api:latest"
          docker push "$REPO/api:${GITHUB_SHA}"
          echo "已发布 $REPO/api:latest 与 $REPO/api:${GITHUB_SHA:0:7}"

      - name: 构建站点镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/site/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ecn-site:ci
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max

      - name: 发布站点镜像到 GHCR（仅 main）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ steps.image.outputs.repo }}
        run: |
          set -e
          docker tag ecn-site:ci "$REPO/site:latest"
          docker tag ecn-site:ci "$REPO/site:${GITHUB_SHA}"
          docker push "$REPO/site:latest"
          docker push "$REPO/site:${GITHUB_SHA}"
          echo "已发布 $REPO/site:latest 与 $REPO/site:${GITHUB_SHA:0:7}"

      - name: 冒烟：API 镜像起容器并等 /api/health（InMemory 模式，不需要数据库）
        run: |
          set -e
          docker run -d --name ecn-api-smoke -p 8787:8787 ecn-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then
              echo "API 容器健康检查通过 ✔"
              curl -s http://127.0.0.1:8787/api/knowledge/stats | head -c 300; echo
              exit 0
            fi
            sleep 2
          done
          echo "API 容器未在 60s 内就绪，输出日志："
          docker logs ecn-api-smoke
          exit 1

      - name: 冒烟：站点镜像可**独立**启动并服务静态内容（不依赖 api 服务）
        run: |
          set -e
          docker run -d --name ecn-site-smoke -p 8080:80 ecn-site:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # 容器必须已经起来（nginx 启动阶段不得依赖 api 主机名）
          docker ps --filter name=ecn-site-smoke --filter status=running | grep -q ecn-site-smoke
          curl -fsS http://127.0.0.1:8080/ | grep -q "Effect" && echo "首页 OK ✔"
          curl -fsS http://127.0.0.1:8080/llms.txt | head -3
          curl -fsS -o /dev/null -w "搜索索引 /search-index.json → %{http_code}\n" http://127.0.0.1:8080/search-index.json
          # 文档页与 .md 静态端点
          curl -fsS -o /dev/null -w "文档页 → %{http_code}\n" http://127.0.0.1:8080/docs/v4/onboarding/
          curl -fsS -o /dev/null -w "llms-full.txt → %{http_code}\n" http://127.0.0.1:8080/llms-full.txt
          # 没有 api 服务时 /api 应当是 502（而不是站点崩掉）
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/health)
          echo "无 API 时 /api/health → $code（预期 502）"
          test "$code" = "502" || test "$code" = "504"

      - name: 收尾（打印容器日志，便于失败排查）
        if: always()
        run: |
          docker logs ecn-api-smoke 2>&1 | tail -20 || true
          docker logs ecn-site-smoke 2>&1 | tail -10 || true
          docker rm -f ecn-api-smoke ecn-site-smoke 2>/dev/null || true
