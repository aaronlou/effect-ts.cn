name: upstream-sync

on:
  schedule:
    # 每日 03:00 UTC ≈ 北京 11:00；可按需调整
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_content_dir:
        description: 上游内容目录（Effect-TS/website 仓库内）
        default: apps/web/src/content/docs

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # 巡检要开/更新 issue
    env:
      # 官方文档内容在 website 仓库（不是 effect 仓库！effect 仓库里没有 docs/）
      UPSTREAM_REPO: Effect-TS/website
      # ⚠️ 必须是**绝对路径**。`pnpm --filter exec` 的工作目录是**包目录**
      # （packages/content），所以传给它的任何 `-o` / `--out` 都会被解析成
      # `packages/content/<相对路径>` —— 文件确实写成功了，但后续步骤（上传产物、
      # 读报告）在工作区根目录找不到它。表现是最阴的一种失败：
      # **所有步骤都是绿的，而报告全是 unknown。**
      # 这个坑在本文件里已经踩过三次（snapshot / nav / diff 各一次），所以统一走这个变量。
      ARTIFACTS: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v4

      # 不写 version：由根 package.json 的 packageManager 决定（写死会冲突，见 ci.yml 同处注释）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 克隆上游内容（blobless + 稀疏检出，只取内容目录）
        run: |
          set -e
          CONTENT_DIR="${{ inputs.upstream_content_dir || 'apps/web/src/content/docs' }}"
          rm -rf upstream
          git clone --filter=blob:none --single-branch --branch main --no-checkout \
            "https://github.com/${UPSTREAM_REPO}.git" upstream
          git -C upstream sparse-checkout set --no-cone "$CONTENT_DIR"
          git -C upstream checkout
          git -C upstream log -1 --format='%H' > upstream-head.txt

      - name: 生成上游快照
        run: |
          mkdir -p "$ARTIFACTS"
          # ⚠️ 必须用**绝对路径**：`pnpm --filter exec` 的工作目录是**包目录**
          # （packages/content），相对路径会被解析成 packages/content/upstream/...
          # 这个坑让整个巡检从 2026-09-11 起每天都挂在第一步（issue #1 一直是 "unknown 篇"）。
          pnpm --filter @ecn/content exec tsx src/cli.ts snapshot \
            --dir "$GITHUB_WORKSPACE/upstream/${{ inputs.upstream_content_dir || 'apps/web/src/content/docs' }}" \
            -o "$ARTIFACTS/upstream-snapshot.json"

      - name: 重新生成侧边栏导航并检查是否漂移
        run: |
          set +e
          # 注意：pnpm --filter exec 的工作目录是包目录，路径必须用绝对路径
          pnpm --filter @ecn/content exec tsx src/cli.ts nav \
            --dir "$GITHUB_WORKSPACE/upstream/${{ inputs.upstream_content_dir || 'apps/web/src/content/docs' }}" \
            -o "$ARTIFACTS/docs-nav.json"
          # 只比结构：生成的 nav 里带着 head（上游 commit）与 generatedAt（时间戳），
          # 每次都不同 —— 直接 diff 会让这条巡检**恒报漂移**（实测：结构完全一致，
          # 只有那两行不同）。比对逻辑在 scripts/nav-drift.mjs，退出码 2 = 读不到文件，
          # 那种情况要报成 unknown 而不是"有漂移"。
          node "$GITHUB_WORKSPACE/scripts/nav-drift.mjs" \
            "$ARTIFACTS/docs-nav.json" \
            "$GITHUB_WORKSPACE/apps/site/src/data/docs-nav.json"
          case $? in
            0) echo "NAV_DRIFT=0" >> "$GITHUB_ENV" ;;
            1) echo "NAV_DRIFT=1" >> "$GITHUB_ENV" ;;
            *) echo "NAV_DRIFT=unknown" >> "$GITHUB_ENV" ;;
          esac

      - name: 代码块一致性（译文 vs 上游；有漂移则开 issue）
        run: |
          set +e
          # 用 --out 写文件，**不要**用 `--json > 文件`：有漂移时本命令退出码为 1，
          # 而 pnpm 会把 `[ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL] ...` 追加到 stdout ——
          # 于是产物恰恰在"有漂移、最需要它"的时候是坏 JSON。
          pnpm --filter @ecn/content exec tsx src/cli.ts code:check \
            --upstream "$GITHUB_WORKSPACE/upstream/${{ inputs.upstream_content_dir || 'apps/web/src/content/docs' }}" \
            --docs "$GITHUB_WORKSPACE/apps/site/src/content/docs" \
            --proposals "$GITHUB_WORKSPACE/.proposals" \
            --out "$ARTIFACTS/code-parity.json"
          CODE_STATUS=$?
          echo "CODE_PARITY_STATUS=$CODE_STATUS" >> "$GITHUB_ENV"
          # 本工作流是"巡检 + 开 issue"，不在这里阻断；
          # PR 侧的阻断门禁见 ci.yml 的 parity job。
          exit 0

      - name: 比对译文是否落后（写报告；有落后不阻断本步）
        continue-on-error: true
        run: |
          set +e
          # --repo 让 diff 用 git 祖先关系判定"真落后"：
          # 否则只要译文基线（抓取时的 HEAD）与上游该文件最后改动的 commit 字符串不同，
          # 就会把**其实是最新的**译文成批误报成落后（曾一次 83 篇）。
          pnpm --filter @ecn/content exec tsx src/cli.ts diff \
            --snapshot "$ARTIFACTS/upstream-snapshot.json" \
            --docs "$GITHUB_WORKSPACE/apps/site/src/content/docs" \
            --repo "$GITHUB_WORKSPACE/upstream" \
            --out "$ARTIFACTS/stale-report.json" || true
          echo "diff 完成"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync
          path: ${{ env.ARTIFACTS }}

      - name: 有落后 / 漂移 / 检查失败时开或更新 issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 缺报告 = 不知道，不等于「没问题」：原来 N 默认 0，
          # 于是 diff 步骤崩掉时会打印「无落后译文 ✔」，把失败伪装成健康。
          N="unknown"
          if [ -f "$ARTIFACTS/stale-report.json" ]; then
            N=$(node -e "const r=require(process.env.ARTIFACTS + '/stale-report.json');process.stdout.write(String((r.stale||[]).length))")
          fi
          DRIFT="${NAV_DRIFT:-unknown}"
          PARITY="${CODE_PARITY_STATUS:-unknown}"

          if [ "$N" = "0" ] && [ "$DRIFT" = "0" ] && [ "$PARITY" = "0" ]; then
            echo "无落后译文、无导航漂移、代码块一致 ✔"
            # 恢复时**关掉**遗留的 issue。
            # 不关的话它会一直挂着一条过期的「N 篇落后」，而"现在没问题"这件事
            # 在任何地方都看不见 —— 红灯会喊，绿灯不会。issue 列表于是只剩噪音，
            # 下次真的出问题时也就没人看了。
            EXISTS=$(gh issue list --state open --label "upstream-sync" --json number -q '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTS" ]; then
              gh issue close "$EXISTS" \
                --comment "本轮巡检：无落后译文、无导航漂移、代码块一致（$(date -u +%Y-%m-%dT%H:%MZ)），自动关闭。"
              echo "已关闭遗留 issue #$EXISTS"
            fi
            exit 0
          fi

          SUFFIX=""
          if [ "$DRIFT" = "1" ]; then SUFFIX="$SUFFIX + 导航漂移"; fi
          if [ "$PARITY" = "1" ]; then SUFFIX="$SUFFIX + 代码块漂移"; fi

          BODY=$(printf '上游同步检查结果：\n\n- 落后译文：`%s` 篇（`unknown` = 报告缺失，说明 diff 步骤失败）\n- 侧边栏导航漂移：`%s`（1 = 上游目录结构有变化）\n- 代码块一致性退出码：`%s`（0 = 与上游逐字节一致）\n\n产物见本次工作流的 `artifacts/`：`stale-report.json` / `docs-nav.json` / `code-parity.json`。\n落后译文请译者更新基线（`upstreamCommit`）；导航漂移请重新生成 `apps/site/src/data/docs-nav.json`；代码块漂移按 `code-parity.json` 逐文件修。' "$N" "$DRIFT" "$PARITY")
          TITLE="📌 上游同步：$N 篇译文落后$SUFFIX"

          # label 不存在时 create 会直接失败（仓库里本来就没有这个 label）
          gh label create upstream-sync --color FBCA04 --description "上游同步巡检自动创建" 2>/dev/null || true

          EXISTS=$(gh issue list --state open --label "upstream-sync" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            # 注意：gh 没有 `issue update` 子命令（只有 `edit`）——原写法在第二次巡检时必然报错
            gh issue edit "$EXISTS" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "upstream-sync"
          fi
