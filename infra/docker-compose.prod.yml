# 生产部署（单机全 Docker）：站点 + API + Postgres
#
# 这个编排是为「服务器上已经有别的站点」设计的，三条端口纪律：
#   1. db 与 api **不发布任何宿主端口**，只在 compose 网络内互通；
#   2. web 只绑 **127.0.0.1**（回环），默认 18080 —— 不碰 80/443，不与现有站点抢端口，
#      也不把站点直接暴露到公网；
#   3. HTTPS 交给服务器上**已有的 Caddy/Nginx**（推荐）或本编排之外的 Caddy 容器，
#      由它反代到 127.0.0.1:${WEB_PORT}（见 infra/Caddyfile.effect-ts.cn 与 docs/deployment.md §3.7）。
#
# 用法（在仓库根目录）：
#   cp .env.example .env                 # 至少填 DEEPSEEK_API_KEY（可留空 → extractive 模式）
#   pnpm docker:ports                    # ← 先看哪些端口被占用（现有站点 + docker 已发布端口）
#   pnpm docker:up                       # = docker compose -f infra/docker-compose.prod.yml up -d --build
#   本地自测：curl -I http://127.0.0.1:${WEB_PORT:-18080}/
#
# 说明：
# - 站点容器自带 Nginx：托管 apps/site/dist 并把 /api/ 反代给 api 服务（见 apps/site/nginx.conf）
# - 只要 .env 里 DEEPSEEK_API_KEY 留空，AI 走 extractive 模式（无模型、零成本、完全可溯源）
# - 数据卷 effect_ts_cn_pgdata 保存 Postgres 数据；删除容器不影响数据
# - 首次上线前建议先本地 `docker compose -f infra/docker-compose.prod.yml build` 验证镜像

services:
  db:
    image: postgres:16-alpine
    container_name: ecn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-effect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-effect}
      POSTGRES_DB: ${POSTGRES_DB:-effect_ts_cn}
    volumes:
      - ecn_pgdata:/var/lib/postgresql/data
      # 仅在**全新数据卷**时执行（存量库不会回溯），见该文件里的说明
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-effect} -d ${POSTGRES_DB:-effect_ts_cn}"]
      interval: 10s
      timeout: 3s
      retries: 10
    # 生产环境不对外暴露数据库端口：只让 api 通过 compose 网络访问
    expose:
      - "5432"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # 生产服务器用 GHCR 上的镜像（.env 里设 API_IMAGE=ghcr.io/<owner>/<repo>/api:latest）；
    # 本地 `pnpm docker:up --build` 不设则用本地构建的 ecn-api:latest。
    image: ${API_IMAGE:-ecn-api:latest}
    container_name: ecn-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_PORT: "8787"
      DATABASE_URL: postgresql://${POSTGRES_USER:-effect}:${POSTGRES_PASSWORD:-effect}@db:5432/${POSTGRES_DB:-effect_ts_cn}
      ASK_RATE_LIMIT_PER_MINUTE: ${ASK_RATE_LIMIT_PER_MINUTE:-20}
      # 成本闸门（见 docs/deployment.md §3.9）：
      # **必须在这里列举**——compose 的 environment 是白名单，只写进 .env 是传不进容器的。
      # 这个坑是实测出来的：改了 .env 里的预算，容器却毫无变化（因为配置哈希没变，根本没重建）。
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      ASK_DAILY_LIMIT_PER_IP: ${ASK_DAILY_LIMIT_PER_IP:-80}
      # 限流 key 的来源：生产由同编排的 web(nginx) 反代，X-Real-IP 可信。
      # 只有把 api 直接暴露到公网时才应设为 false。
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      # 留空即 extractive 模式；填了就走 DeepSeek 润色（引用仍来自检索）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    expose:
      - "8787"

  # ── 自建统计（可选，默认不启动）──────────────────────────────────────────
  #
  # 为什么默认不启动：**服务端日志报表已经覆盖了核心需求**（见 scripts/traffic-report.mjs），
  # 而这一层是"要个仪表盘 UI"时才值得的额外复杂度（多一个容器 + 一个库 + 反代路由）。
  #
  # 为什么自建而不是 Google Analytics：本站访客以大陆为主，GA 的域名在大陆不可达，
  # 用它只会系统性低估真正的受众。自建 + 同源 ⇒ 不受网络封锁与广告拦截影响，
  # 无 Cookie、数据只留在自己服务器上。
  #
  # 启用：
  #   docker compose -f infra/docker-compose.prod.yml exec db \
  #     psql -U effect -d effect_ts_cn -c 'CREATE DATABASE umami'      # 只需一次
  #   UMAMI_APP_SECRET=$(openssl rand -hex 32) \
  #     docker compose -f infra/docker-compose.prod.yml --profile analytics up -d
  # 然后在 Caddy 里接上 /stats/*（见 infra/Caddyfile.effect-ts.cn），
  # 最后去 Umami 后台建站点、把 websiteId 填进 apps/site/src/data/monetization.ts。
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: ecn-umami
    profiles: ["analytics"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-effect}:${POSTGRES_PASSWORD:-effect}@db:5432/umami
      # 占位默认值而非 `:?` 必填：CI 要跑 `docker compose config` 校验编排，
      # 用必填语法会让 CI 在没有该变量时直接失败。**启用 analytics 前务必替换**：
      #   UMAMI_APP_SECRET=$(openssl rand -hex 32)
      APP_SECRET: ${UMAMI_APP_SECRET:-CHANGE_ME_BEFORE_ENABLING}
      # 与站点同源挂在子路径下；同源是关键 —— 跨域脚本在大陆更容易被拦
      BASE_PATH: /stats
    ports:
      # 只绑回环：由宿主机 Caddy 反代 /stats/*，与站点共用同一个域名与证书
      - "127.0.0.1:${UMAMI_PORT:-18081}:3000"

  web:
    build:
      context: ..
      dockerfile: apps/site/Dockerfile
    image: ${WEB_IMAGE:-ecn-site:latest}
    container_name: ecn-web
    restart: unless-stopped
    depends_on:
      - api
    # 只绑回环：Caddy 在宿主机上反代到 127.0.0.1:${WEB_PORT}。
    # 这样既有站点继续占用 80/443，我们不需要、也不应该去动它们。
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"

networks:
  default:
    name: ecn

volumes:
  ecn_pgdata:
