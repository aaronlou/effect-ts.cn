# 叠加文件：把 ecn-web 接入「已有 Caddy 容器」所在的 docker 网络，
# 这样 Caddy 可以直连容器（reverse_proxy ecn-web:80），完全不需要宿主端口。
#
# 用法：
#   docker network create caddy        # 若已存在会报错，忽略即可
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.caddy-network.yml up -d
#
# 网络名用环境变量 CADDY_NETWORK 覆盖（默认 caddy）。
services:
  web:
    networks:
      - default
      - caddy

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
