# effect-ts.cn —— 给「服务器 443 已被现有 Nginx 占用」的场景
#
# 放到现有 Nginx 的 conf.d/ 下（文件名随意，例如 effect-ts.cn.conf），然后 nginx -t && systemctl reload nginx。
# 要点：**不要**新起一个监听 443 的 Nginx —— 同一端口只能有一个进程；
#      把新域名作为 server_name 加进现有 Nginx 即可（Nginx 按 server_name 分流，与 Caddy 按 SNI 分流同理）。

# ① 80：只保留 ACME 挑战，其余 301 到 HTTPS
server {
    listen 80;
    server_name effect-ts.cn www.effect-ts.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;      # 与 certbot --webroot 的路径保持一致
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ② 443：与现有站点**共用**该端口，靠 server_name 区分
server {
    listen 443 ssl;
    http2 on;
    server_name effect-ts.cn www.effect-ts.cn;

    # 证书由 certbot 申请（见文件末尾命令）；路径按实际域名调整
    ssl_certificate     /etc/letsencrypt/live/effect-ts.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/effect-ts.cn/privkey.pem;

    # 与现有站点保持一致的 TLS 策略即可；下面是保守可用的版本
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 我们的站点容器只绑在回环：127.0.0.1:${WEB_PORT:-18080}
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # 模型润色可能较慢
        proxy_connect_timeout 5s;
    }
}

# 申请/续期证书（二选一，与现有站点的做法保持一致）：
#   certbot --nginx -d effect-ts.cn -d www.effect-ts.cn
#   certbot certonly --webroot -w /var/www/certbot -d effect-ts.cn -d www.effect-ts.cn
#
# 排查用：
#   nginx -t                                  # 配置语法
#   curl -sI https://effect-ts.cn | head -3    # 生效后自测
#   curl -s  http://127.0.0.1:18080/api/health # 绕过反代直连站点容器
