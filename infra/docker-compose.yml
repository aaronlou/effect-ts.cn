# 本地开发数据库。用法：
#   pnpm db:up      （启动）
#   pnpm db:down    （停止）
# 连接串见 apps/api/.env.example；默认：
#   postgresql://effect:effect@localhost:5432/effect_ts_cn
# 注：中文全文检索分词（pg_jieba）在 Phase 1 引入，此处为普通镜像。
services:
  postgres:
    image: postgres:16-alpine
    container_name: effect-ts-cn-db
    environment:
      POSTGRES_USER: effect
      POSTGRES_PASSWORD: effect
      POSTGRES_DB: effect_ts_cn
    ports:
      - "5432:5432"
    volumes:
      - effect_ts_cn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effect -d effect_ts_cn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  effect_ts_cn_pgdata:
